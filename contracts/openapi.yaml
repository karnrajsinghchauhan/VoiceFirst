components:
  schemas:
    ApiKeyIn:
      additionalProperties: false
      properties:
        expires_in_days:
          anyOf:
          - maximum: 730.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Expires In Days
        name:
          maxLength: 80
          minLength: 3
          title: Name
          type: string
        reason:
          maxLength: 500
          minLength: 3
          title: Reason
          type: string
        role:
          enum:
          - admin
          - ops
          - auditor
          - read_only
          title: Role
          type: string
        scopes:
          anyOf:
          - items:
              enum:
              - campaigns:read
              - campaigns:write
              - calls:read
              - transcripts:read
              - consent:read
              - consent:write
              - cli:read
              - cli:write
              - handoff:read
              - handoff:write
              - killswitch:read
              - killswitch:write
              - metrics:read
              - simulate:run
              - rights:read
              - rights:write
              - incidents:read
              - incidents:write
              - audit:read
              - apikeys:write
              type: string
            type: array
          - type: 'null'
          title: Scopes
      required:
      - name
      - role
      - reason
      title: ApiKeyIn
      type: object
    ApiKeyOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by:
          title: Created By
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        key_id:
          title: Key Id
          type: string
        last_used_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Used At
        name:
          title: Name
          type: string
        replaced_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Replaced By
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        role:
          title: Role
          type: string
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
      required:
      - key_id
      - name
      - role
      - scopes
      - created_at
      - created_by
      - expires_at
      - last_used_at
      - revoked_at
      - replaced_by
      title: ApiKeyOut
      type: object
    AuditEvent:
      additionalProperties: false
      description: One privileged action. Append-only.
      properties:
        action:
          minLength: 1
          title: Action
          type: string
        actor:
          minLength: 1
          title: Actor
          type: string
        at:
          format: date-time
          title: At
          type: string
        audit_id:
          minLength: 1
          title: Audit Id
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        role:
          enum:
          - admin
          - ops
          - auditor
          - read_only
          - system
          title: Role
          type: string
        schema_version:
          const: 1.0.0
          title: Schema Version
          type: string
        target:
          title: Target
          type: string
        tenant_id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          title: Tenant Id
          type: string
        trace_id:
          pattern: ^[0-9a-f]{32}$
          title: Trace Id
          type: string
      required:
      - schema_version
      - tenant_id
      - trace_id
      - audit_id
      - at
      - actor
      - role
      - action
      - target
      - reason
      title: AuditEvent
      type: object
    CallOutcome:
      additionalProperties: false
      properties:
        ai_generated:
          const: true
          description: REQ-AI-01.
          title: Ai Generated
          type: boolean
        amd_result:
          enum:
          - human
          - machine-ivr
          - machine-vm
          - machine-unavailable
          - uncertain
          - not_run
          title: Amd Result
          type: string
        answered:
          title: Answered
          type: boolean
        booking_id:
          minLength: 4
          title: Booking Id
          type: string
        call_id:
          minLength: 1
          title: Call Id
          type: string
        clearance_id:
          minLength: 1
          title: Clearance Id
          type: string
        cli:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Cli
          type: string
        cost:
          $ref: '#/components/schemas/Cost'
        disclosure_played_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Disclosure Played At
        grievance_channel:
          description: REQ-CP-03.
          minLength: 1
          title: Grievance Channel
          type: string
        handoff:
          anyOf:
          - $ref: '#/components/schemas/Handoff'
          - type: 'null'
        language_detected:
          enum:
          - hi
          - en
          - hinglish
          - unknown
          title: Language Detected
          type: string
        latency_ms:
          $ref: '#/components/schemas/LatencyMs'
        model_ids:
          additionalProperties:
            type: string
          title: Model Ids
          type: object
        outcome:
          enum:
          - link_sent
          - details_confirmed
          - callback_scheduled
          - handed_off
          - opted_out
          - wrong_person
          - minor_on_line
          - no_answer
          - voicemail
          - declined
          - abandoned
          - error
          title: Outcome
          type: string
        provenance_hash:
          pattern: ^[0-9a-f]{64}$
          title: Provenance Hash
          type: string
        purpose:
          enum:
          - J1
          - J2
          title: Purpose
          type: string
        redaction_applied:
          title: Redaction Applied
          type: boolean
        schema_version:
          const: 1.0.0
          title: Schema Version
          type: string
        sensitive_data_spoken:
          title: Sensitive Data Spoken
          type: boolean
        started_at:
          format: date-time
          title: Started At
          type: string
        tenant_id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          title: Tenant Id
          type: string
        tools_called:
          items:
            $ref: '#/components/schemas/ToolsCalledItem'
          title: Tools Called
          type: array
        trace_id:
          pattern: ^[0-9a-f]{32}$
          title: Trace Id
          type: string
        turns:
          minimum: 0.0
          title: Turns
          type: integer
      required:
      - schema_version
      - tenant_id
      - trace_id
      - call_id
      - clearance_id
      - booking_id
      - purpose
      - cli
      - started_at
      - answered
      - amd_result
      - language_detected
      - disclosure_played_at
      - turns
      - tools_called
      - outcome
      - handoff
      - latency_ms
      - cost
      - redaction_applied
      - sensitive_data_spoken
      - grievance_channel
      - ai_generated
      - model_ids
      - provenance_hash
      title: CallOutcome
      type: object
    CampaignView:
      additionalProperties: false
      properties:
        campaign_id:
          title: Campaign Id
          type: string
        dialled:
          title: Dialled
          type: integer
        held_out:
          title: Held Out
          type: integer
        purpose:
          enum:
          - J1
          - J2
          title: Purpose
          type: string
        queued:
          title: Queued
          type: integer
        status:
          enum:
          - active
          - paused
          title: Status
          type: string
      required:
      - campaign_id
      - purpose
      - status
      - queued
      - dialled
      - held_out
      title: CampaignView
      type: object
    Cli:
      additionalProperties: false
      properties:
        a2p_declared:
          title: A2P Declared
          type: boolean
        cli_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Cli E164
          type: string
        declaration_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Declaration Ref
        dlt_recorded_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Dlt Recorded At
        oap:
          minLength: 1
          title: Oap
          type: string
        paused_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Paused Reason
        purpose:
          enum:
          - service
          - transactional
          - promotional
          title: Purpose
          type: string
        schema_version:
          const: 1.0.0
          title: Schema Version
          type: string
        series:
          enum:
          - '140'
          - '1600'
          - '1601'
          title: Series
          type: string
        status:
          enum:
          - active
          - paused
          - retired
          title: Status
          type: string
        tenant_id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          title: Tenant Id
          type: string
        trace_id:
          pattern: ^[0-9a-f]{32}$
          title: Trace Id
          type: string
      required:
      - schema_version
      - tenant_id
      - trace_id
      - cli_e164
      - series
      - purpose
      - oap
      - a2p_declared
      - declaration_ref
      - dlt_recorded_at
      - status
      - paused_reason
      title: Cli
      type: object
    CliIn:
      additionalProperties: false
      properties:
        a2p_declared:
          title: A2P Declared
          type: boolean
        declaration_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Declaration Ref
        dlt_recorded_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Dlt Recorded At
        oap:
          minLength: 1
          title: Oap
          type: string
        paused_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Paused Reason
        purpose:
          enum:
          - service
          - transactional
          - promotional
          title: Purpose
          type: string
        series:
          enum:
          - '140'
          - '1600'
          - '1601'
          title: Series
          type: string
        status:
          enum:
          - active
          - paused
          - retired
          title: Status
          type: string
      required:
      - series
      - purpose
      - oap
      - a2p_declared
      - status
      title: CliIn
      type: object
    CompleteIn:
      additionalProperties: false
      properties:
        note:
          default: ''
          maxLength: 2000
          title: Note
          type: string
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
      required:
      - phone_e164
      title: CompleteIn
      type: object
    CompleteOut:
      properties:
        export:
          anyOf:
          - type: object
          - type: 'null'
          title: Export
        request:
          $ref: '#/components/schemas/RightsRequestView'
      required:
      - request
      - export
      title: CompleteOut
      type: object
    ConsentIn:
      additionalProperties: false
      properties:
        basis:
          enum:
          - transaction
          - explicit
          - inquiry
          title: Basis
          type: string
        booking_id:
          anyOf:
          - minLength: 4
            type: string
          - type: 'null'
          title: Booking Id
        channel:
          enum:
          - voice
          - whatsapp
          - sms
          - web
          - dca
          title: Channel
          type: string
        evidence_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Uri
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
        purpose:
          enum:
          - J1
          - J2
          title: Purpose
          type: string
        source_ref:
          minLength: 1
          title: Source Ref
          type: string
      required:
      - phone_e164
      - basis
      - purpose
      - channel
      - source_ref
      title: ConsentIn
      type: object
    ConsentRecord:
      additionalProperties: false
      properties:
        artefact_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Artefact Ref
        basis:
          enum:
          - transaction
          - explicit
          - inquiry
          title: Basis
          type: string
        channel:
          enum:
          - voice
          - whatsapp
          - sms
          - web
          - dca
          title: Channel
          type: string
        consent_id:
          minLength: 1
          title: Consent Id
          type: string
        consent_manager_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 'REQ-DPDP-08: placeholder for a DPDP Consent Manager.'
          title: Consent Manager Id
        evidence_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Uri
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Null only for basis=transaction, which lasts while the booking
            is live.
          title: Expires At
        obtained_at:
          format: date-time
          title: Obtained At
          type: string
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
        purpose:
          enum:
          - J1
          - J2
          title: Purpose
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        schema_version:
          const: 1.0.0
          title: Schema Version
          type: string
        source_ref:
          minLength: 1
          title: Source Ref
          type: string
        tenant_id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          title: Tenant Id
          type: string
        trace_id:
          pattern: ^[0-9a-f]{32}$
          title: Trace Id
          type: string
      required:
      - schema_version
      - tenant_id
      - trace_id
      - consent_id
      - phone_e164
      - basis
      - purpose
      - channel
      - obtained_at
      - expires_at
      - revoked_at
      - source_ref
      - consent_manager_id
      - artefact_ref
      - evidence_uri
      title: ConsentRecord
      type: object
    Cost:
      additionalProperties: false
      description: Minor units (paise).
      properties:
        llm:
          minimum: 0.0
          title: Llm
          type: integer
        stt:
          minimum: 0.0
          title: Stt
          type: integer
        telephony:
          minimum: 0.0
          title: Telephony
          type: integer
        tts:
          minimum: 0.0
          title: Tts
          type: integer
        whatsapp:
          minimum: 0.0
          title: Whatsapp
          type: integer
      required:
      - telephony
      - stt
      - tts
      - llm
      - whatsapp
      title: Cost
      type: object
    ErrorBody:
      properties:
        detail:
          title: Detail
          type: string
        error:
          title: Error
          type: string
      required:
      - error
      - detail
      title: ErrorBody
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Handoff:
      additionalProperties: false
      properties:
        queue:
          minLength: 1
          title: Queue
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        summary:
          minLength: 1
          title: Summary
          type: string
      required:
      - reason
      - summary
      - queue
      title: Handoff
      type: object
    HandoffAction:
      additionalProperties: false
      properties:
        action:
          enum:
          - acknowledge
          - resolve
          title: Action
          type: string
      required:
      - action
      title: HandoffAction
      type: object
    HandoffSummary:
      additionalProperties: false
      description: At most 5 lines, shaped like Agoda's own case summary.
      properties:
        ai_did:
          minLength: 1
          title: Ai Did
          type: string
        booking_masked:
          pattern: ^\*+[A-Za-z0-9]{1,4}$
          title: Booking Masked
          type: string
        call_id:
          minLength: 1
          title: Call Id
          type: string
        customer_wants:
          minLength: 1
          title: Customer Wants
          type: string
        next_best_action:
          minLength: 1
          title: Next Best Action
          type: string
        policy_refs:
          items:
            type: string
          title: Policy Refs
          type: array
        queue:
          minLength: 1
          title: Queue
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
        schema_version:
          const: 1.0.0
          title: Schema Version
          type: string
        sentiment:
          enum:
          - calm
          - concerned
          - angry
          - distressed
          title: Sentiment
          type: string
        sla_ack_due_at:
          description: 48 h acknowledgement (REQ-CP-03).
          format: date-time
          title: Sla Ack Due At
          type: string
        sla_resolve_due_at:
          description: 30-day resolution (REQ-CP-03).
          format: date-time
          title: Sla Resolve Due At
          type: string
        tenant_id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          title: Tenant Id
          type: string
        trace_id:
          pattern: ^[0-9a-f]{32}$
          title: Trace Id
          type: string
        who:
          minLength: 1
          title: Who
          type: string
      required:
      - schema_version
      - tenant_id
      - trace_id
      - call_id
      - who
      - booking_masked
      - customer_wants
      - ai_did
      - sentiment
      - policy_refs
      - next_best_action
      - reason
      - queue
      - sla_ack_due_at
      - sla_resolve_due_at
      title: HandoffSummary
      type: object
    HandoffView:
      properties:
        acknowledged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Acknowledged At
        call_id:
          title: Call Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        crm_ticket_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Crm Ticket Id
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        result:
          enum:
          - transferred
          - callback_scheduled
          title: Result
          type: string
        summary:
          $ref: '#/components/schemas/HandoffSummary'
      required:
      - call_id
      - result
      - created_at
      - acknowledged_at
      - resolved_at
      - crm_ticket_id
      - summary
      title: HandoffView
      type: object
    Health:
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: Health
      type: object
    IncidentIn:
      additionalProperties: false
      properties:
        detected_at:
          format: date-time
          title: Detected At
          type: string
        kind:
          enum:
          - security
          - data_breach
          - telecom_complaint
          - other
          title: Kind
          type: string
        summary:
          maxLength: 2000
          minLength: 3
          title: Summary
          type: string
      required:
      - kind
      - summary
      - detected_at
      title: IncidentIn
      type: object
    IncidentView:
      additionalProperties: false
      properties:
        board_report_due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Board Report Due At
        cert_in_due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Cert In Due At
        detected_at:
          format: date-time
          title: Detected At
          type: string
        incident_id:
          title: Incident Id
          type: string
        kind:
          enum:
          - security
          - data_breach
          - telecom_complaint
          - other
          title: Kind
          type: string
        status:
          enum:
          - open
          - reported
          - closed
          title: Status
          type: string
        summary:
          title: Summary
          type: string
      required:
      - incident_id
      - kind
      - summary
      - detected_at
      - cert_in_due_at
      - board_report_due_at
      - status
      title: IncidentView
      type: object
    IssuedKeyOut:
      properties:
        key_id:
          title: Key Id
          type: string
        token:
          description: Shown once. Store it in your secret manager.
          title: Token
          type: string
      required:
      - key_id
      - token
      title: IssuedKeyOut
      type: object
    KillSwitchIn:
      additionalProperties: false
      properties:
        engaged:
          title: Engaged
          type: boolean
        reason:
          maxLength: 500
          minLength: 3
          title: Reason
          type: string
      required:
      - engaged
      - reason
      title: KillSwitchIn
      type: object
    KillSwitchState:
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        changed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Changed At
        engaged:
          title: Engaged
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      required:
      - engaged
      - actor
      - reason
      - changed_at
      title: KillSwitchState
      type: object
    LatencyMs:
      additionalProperties: false
      properties:
        p50:
          minimum: 0.0
          title: P50
          type: integer
        p95:
          minimum: 0.0
          title: P95
          type: integer
      required:
      - p50
      - p95
      title: LatencyMs
      type: object
    OptOutIn:
      additionalProperties: false
      properties:
        channel:
          enum:
          - voice
          - whatsapp
          - sms
          - web
          - dca
          title: Channel
          type: string
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
      required:
      - phone_e164
      - channel
      title: OptOutIn
      type: object
    PhoneIn:
      additionalProperties: false
      properties:
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
      required:
      - phone_e164
      title: PhoneIn
      type: object
    ReasonIn:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          minLength: 3
          title: Reason
          type: string
      required:
      - reason
      title: ReasonIn
      type: object
    RightsRequestIn:
      additionalProperties: false
      properties:
        kind:
          enum:
          - access
          - correction
          - erasure
          title: Kind
          type: string
        phone_e164:
          pattern: ^\+[1-9][0-9]{6,14}$
          title: Phone E164
          type: string
      required:
      - phone_e164
      - kind
      title: RightsRequestIn
      type: object
    RightsRequestView:
      properties:
        ack_due_at:
          format: date-time
          title: Ack Due At
          type: string
        acknowledged_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Acknowledged At
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        due_at:
          format: date-time
          title: Due At
          type: string
        kind:
          enum:
          - access
          - correction
          - erasure
          title: Kind
          type: string
        received_at:
          format: date-time
          title: Received At
          type: string
        request_id:
          title: Request Id
          type: string
        result:
          title: Result
          type: object
        status:
